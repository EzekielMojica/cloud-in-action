<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex">
    <meta name="theme-color" content="#f6f8fb" media="(prefers-color-scheme: light)">
    <meta name="theme-color" content="#0a0f1c" media="(prefers-color-scheme: dark)">
    <title>Page Not Found | RefineCV</title>
    <!-- Apply a saved theme before first paint (shares the key with index.html) -->
    <script>
        try {
            const savedTheme = localStorage.getItem('refinecv-theme');
            if (savedTheme === 'light' || savedTheme === 'dark') document.documentElement.setAttribute('data-theme', savedTheme);
        } catch (e) {}
    </script>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%231d4ed8'/%3E%3Cpath d='M11 9h7l4 4v10H11z' fill='none' stroke='white' stroke-width='2' stroke-linejoin='round'/%3E%3Cpath d='m14 17 2 2 3-4' fill='none' stroke='white' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <style>
        /*
         * ==========================================
         * DESIGN TOKENS (kept in sync with index.html)
         * ==========================================
         */
        :root {
            color-scheme: light;
            --primary: #0b1730;
            --accent: #1d4ed8;
            --accent-soft: #eff4ff;
            --accent-ring: rgba(29, 78, 216, 0.28);
            --btn-primary-bg: #1d4ed8;
            --btn-primary-hover: #1e40af;
            --success: #047857;
            --success-soft: #ecfdf5;
            --bg: #f6f8fb;
            --bg-glow: rgba(29, 78, 216, 0.10);
            --surface: #ffffff;
            --surface-elevated: #f8fafc;
            --text-main: #0f172a;
            --text-muted: #4b5a70;
            --text-subtle: #7b889c;
            --border: #e4e9f1;
            --border-strong: #cfd8e4;
            --radius: 16px;
            --radius-sm: 10px;
            --shadow-sm: 0 1px 2px rgba(15, 23, 42, 0.05);
            --shadow-md: 0 1px 2px rgba(15, 23, 42, 0.04), 0 12px 32px -12px rgba(15, 23, 42, 0.12);
            --shadow-lg: 0 2px 4px rgba(15, 23, 42, 0.04), 0 30px 60px -24px rgba(15, 23, 42, 0.22);
            --sun-display: none;
            --moon-display: block;
            --font-ui: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
        }

        @media (prefers-color-scheme: dark) {
            :root:not([data-theme="light"]) {
                color-scheme: dark;
                --primary: #e8eefa;
                --accent: #6b9bff;
                --accent-soft: rgba(107, 155, 255, 0.12);
                --accent-ring: rgba(107, 155, 255, 0.45);
                --btn-primary-bg: #2563eb;
                --btn-primary-hover: #1d4ed8;
                --success: #4ade9b;
                --success-soft: rgba(74, 222, 155, 0.10);
                --bg: #0a0f1c;
                --bg-glow: rgba(59, 110, 245, 0.18);
                --surface: #111a2c;
                --surface-elevated: #0d1525;
                --text-main: #e8eefa;
                --text-muted: #a3b0c6;
                --text-subtle: #6f7d96;
                --border: #1f2b41;
                --border-strong: #2e3d58;
                --shadow-sm: 0 1px 2px rgba(0, 0, 0, 0.4);
                --shadow-md: 0 1px 2px rgba(0, 0, 0, 0.3), 0 12px 32px -12px rgba(0, 0, 0, 0.6);
                --shadow-lg: 0 2px 4px rgba(0, 0, 0, 0.3), 0 30px 60px -24px rgba(0, 0, 0, 0.75);
                --sun-display: block;
                --moon-display: none;
            }
        }
        :root[data-theme="dark"] {
            color-scheme: dark;
            --primary: #e8eefa;
            --accent: #6b9bff;
            --accent-soft: rgba(107, 155, 255, 0.12);
            --accent-ring: rgba(107, 155, 255, 0.45);
            --btn-primary-bg: #2563eb;
            --btn-primary-hover: #1d4ed8;
            --success: #4ade9b;
            --success-soft: rgba(74, 222, 155, 0.10);
            --bg: #0a0f1c;
            --bg-glow: rgba(59, 110, 245, 0.18);
            --surface: #111a2c;
            --surface-elevated: #0d1525;
            --text-main: #e8eefa;
            --text-muted: #a3b0c6;
            --text-subtle: #6f7d96;
            --border: #1f2b41;
            --border-strong: #2e3d58;
            --shadow-sm: 0 1px 2px rgba(0, 0, 0, 0.4);
            --shadow-md: 0 1px 2px rgba(0, 0, 0, 0.3), 0 12px 32px -12px rgba(0, 0, 0, 0.6);
            --shadow-lg: 0 2px 4px rgba(0, 0, 0, 0.3), 0 30px 60px -24px rgba(0, 0, 0, 0.75);
            --sun-display: block;
            --moon-display: none;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }
        html { -webkit-text-size-adjust: 100%; }
        body {
            font-family: var(--font-ui);
            background:
                radial-gradient(900px 420px at 50% -120px, var(--bg-glow), transparent 70%),
                var(--bg);
            color: var(--text-main);
            line-height: 1.6;
            min-height: 100vh;
            -webkit-font-smoothing: antialiased;
            transition: background-color 0.25s, color 0.25s;
        }
        .container {
            max-width: 1080px; min-height: 100vh; margin: 0 auto; padding: 0 24px;
            display: flex; flex-direction: column;
        }

        .icon {
            width: 18px; height: 18px; flex-shrink: 0;
            fill: none; stroke: currentColor; stroke-width: 1.8;
            stroke-linecap: round; stroke-linejoin: round;
        }
        :focus-visible { outline: 3px solid var(--accent-ring); outline-offset: 2px; border-radius: 8px; }

        /* ── Nav (same as index.html) ── */
        .site-nav { display: flex; align-items: center; justify-content: space-between; gap: 16px; padding: 22px 0; }
        .brand { display: flex; align-items: center; gap: 10px; font-weight: 700; font-size: 1.05rem; letter-spacing: -0.01em; color: var(--primary); text-decoration: none; }
        .brand-mark {
            width: 34px; height: 34px; border-radius: 9px;
            display: grid; place-items: center; color: #fff;
            background: linear-gradient(145deg, #2563eb, #1e3a8a);
            box-shadow: 0 6px 14px -4px rgba(29, 78, 216, 0.45), inset 0 1px 0 rgba(255, 255, 255, 0.2);
        }
        .brand-mark .icon { stroke-width: 2; }
        .theme-toggle {
            width: 36px; height: 36px; border-radius: 999px;
            display: grid; place-items: center; cursor: pointer;
            background: var(--surface); border: 1px solid var(--border); color: var(--text-muted);
            box-shadow: var(--shadow-sm);
            transition: color 0.18s, border-color 0.18s, background-color 0.18s;
        }
        .theme-toggle:hover { color: var(--accent); border-color: var(--accent); }
        .theme-toggle .icon { width: 17px; height: 17px; }
        .theme-toggle .icon-sun { display: var(--sun-display); }
        .theme-toggle .icon-moon { display: var(--moon-display); }

        /* ── 404 card ── */
        main { flex: 1; display: grid; place-items: center; padding: 40px 0 56px; }
        .error-card {
            width: 100%; max-width: 560px; text-align: center;
            background: var(--surface); border: 1px solid var(--border);
            border-radius: calc(var(--radius) + 4px);
            padding: 14px; box-shadow: var(--shadow-lg);
        }
        .error-inner {
            border: 1.5px dashed var(--border-strong);
            background:
                radial-gradient(400px 160px at 50% 0%, rgba(29, 78, 216, 0.06), transparent 70%),
                var(--surface-elevated);
            border-radius: var(--radius);
            padding: 44px 28px 40px;
        }
        .error-icon {
            width: 60px; height: 60px; margin: 0 auto 22px;
            display: grid; place-items: center;
            border-radius: 16px; color: var(--accent);
            background: var(--surface); border: 1px solid var(--border);
            box-shadow: var(--shadow-md);
        }
        .error-icon .icon { width: 28px; height: 28px; stroke-width: 1.6; }
        .error-code {
            display: inline-block; margin-bottom: 12px;
            padding: 4px 12px; border-radius: 999px;
            background: var(--accent-soft); color: var(--accent);
            font-size: 0.75rem; font-weight: 700; letter-spacing: 0.1em; text-transform: uppercase;
        }
        h1 {
            font-size: clamp(1.8rem, 5vw, 2.4rem); font-weight: 800;
            letter-spacing: -0.035em; line-height: 1.15;
            color: var(--primary); margin-bottom: 12px;
        }
        .error-text { color: var(--text-muted); font-size: 1rem; max-width: 380px; margin: 0 auto 28px; }

        .btn {
            display: inline-flex; align-items: center; justify-content: center; gap: 8px;
            padding: 11px 22px; border-radius: var(--radius-sm);
            font-family: inherit; font-weight: 600; font-size: 0.93rem; line-height: 1.2;
            text-decoration: none; cursor: pointer; border: 1px solid transparent;
            transition: background-color 0.18s, box-shadow 0.18s, transform 0.18s;
        }
        .btn:active { transform: translateY(1px); }
        .btn-primary {
            background: var(--btn-primary-bg); color: #fff;
            box-shadow: 0 1px 2px rgba(15, 23, 42, 0.12), 0 8px 18px -8px rgba(29, 78, 216, 0.6), inset 0 1px 0 rgba(255, 255, 255, 0.15);
        }
        .btn-primary:hover { background: var(--btn-primary-hover); }

        .error-footer {
            display: flex; align-items: center; justify-content: center; gap: 10px;
            padding: 16px 8px 4px; font-size: 0.86rem; color: var(--text-muted); text-align: left;
        }
        .security-icon {
            width: 30px; height: 30px; border-radius: 9px; flex-shrink: 0;
            display: grid; place-items: center;
            background: var(--success-soft); color: var(--success);
        }
        .security-icon .icon { width: 16px; height: 16px; stroke-width: 2; }

        .site-footer {
            padding: 24px 0 32px; border-top: 1px solid var(--border);
            text-align: center; font-size: 0.85rem; color: var(--text-subtle); font-style: italic;
        }

        @media (max-width: 480px) {
            .container { padding: 0 16px; }
            .error-inner { padding: 36px 18px 32px; }
        }
        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after { transition: none !important; }
        }
    </style>
</head>
<body>
    <div class="container">

        <nav class="site-nav" aria-label="Site">
            <!-- Absolute "/" because S3 serves this page at whatever path was missing -->
            <a class="brand" href="/">
                <span class="brand-mark" aria-hidden="true">
                    <svg class="icon" viewBox="0 0 24 24"><path d="M15 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7Z"/><path d="m9 14 2 2 4-4"/></svg>
                </span>
                RefineCV
            </a>
            <button class="theme-toggle" id="theme-toggle" type="button" aria-label="Toggle dark mode" title="Toggle dark mode">
                <svg class="icon icon-moon" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"/></svg>
                <svg class="icon icon-sun" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2"/><path d="M12 20v2"/><path d="m4.93 4.93 1.41 1.41"/><path d="m17.66 17.66 1.41 1.41"/><path d="M2 12h2"/><path d="M20 12h2"/><path d="m6.34 17.66-1.41 1.41"/><path d="m19.07 4.93-1.41 1.41"/></svg>
            </button>
        </nav>

        <main>
            <section class="error-card">
                <div class="error-inner">
                    <div class="error-icon">
                        <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M14 2v4a2 2 0 0 0 2 2h4"/><path d="M4.268 21a2 2 0 0 0 1.727 1H18a2 2 0 0 0 2-2V7l-5-5H6a2 2 0 0 0-2 2v3"/><path d="m9 18-1.5-1.5"/><circle cx="5" cy="14" r="3"/></svg>
                    </div>
                    <span class="error-code">Error 404</span>
                    <h1>Page not found</h1>
                    <p class="error-text">The page you're looking for doesn't exist in this S3 bucket.</p>
                    <a class="btn btn-primary" href="/">
                        <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="m12 19-7-7 7-7"/><path d="M19 12H5"/></svg>
                        Go back to the homepage
                    </a>
                </div>
                <div class="error-footer">
                    <span class="security-icon" aria-hidden="true">
                        <svg class="icon" viewBox="0 0 24 24"><rect width="18" height="11" x="3" y="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
                    </span>
                    <span>Your resume is processed locally and never leaves your browser.</span>
                </div>
            </section>
        </main>

        <footer class="site-footer">
            “Whatever you do, work at it with all your heart...” — Colossians 3:23
        </footer>

    </div>

    <!-- Theme toggle: same behavior and storage key as index.html -->
    <script>
        (function () {
            const root = document.documentElement;
            const toggle = document.getElementById('theme-toggle');
            const systemDark = window.matchMedia('(prefers-color-scheme: dark)');
            const isDark = () => root.getAttribute('data-theme') === 'dark' || (!root.hasAttribute('data-theme') && systemDark.matches);
            const syncLabel = () => {
                const label = isDark() ? 'Switch to light mode' : 'Switch to dark mode';
                toggle.setAttribute('aria-label', label);
                toggle.title = label;
            };
            toggle.addEventListener('click', () => {
                const next = isDark() ? 'light' : 'dark';
                root.setAttribute('data-theme', next);
                try { localStorage.setItem('refinecv-theme', next); } catch (e) {}
                syncLabel();
            });
            systemDark.addEventListener('change', syncLabel);
            syncLabel();
        })();
    </script>
</body>
</html>
